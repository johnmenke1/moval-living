name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false  # never kill a deploy mid-flight

jobs:
  deploy:
    name: Build & deploy via vinext-cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify types
        run: pnpm exec tsc --noEmit

      # Deploy — `npm run deploy:vinext` runs `vinext-cloudflare deploy` which
      # builds the bundle (vite + vinext) and uploads to the moval-living worker.
      # It reads CLOUDFLARE_API_TOKEN from the environment.
      #
      # NEXT_PUBLIC_GOOGLE_MAPS_API_KEY is inlined into the client bundle at
      # build time (it's how the 'use client' map components
      # — ParkMap, BusinessMap, ListingMap, HauntedMap, etc — get their key).
      # Server-side code reads GOOGLE_PLACES_API_KEY (a Worker secret), which is
      # a separate binding. We carry both names so the same Google Cloud key
      # powers both code paths.
      #
      # NEXT_PUBLIC_TURNSTILE_SITE_KEY is the same pattern for the Turnstile
      # widget on the Halloween entry form, the /claim and /partner-lead
      # forms, the email-change form, the forgot-password form, and the
      # best-of nomination form. Server-side `verifyTurnstileOrSkip` reads
      # `TURNSTILE_SECRET_KEY` (a separate Worker secret). Both must be set
      # together — without the site key inlined into the client bundle, the
      # widget renders the `data-turnstile="missing-key"` fallback and every
      # form POST comes back 403 with reason `missing-token`.
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: pnpm run deploy:vinext

      - name: Smoke test
        run: |
          sleep 15
          for path in / /best-of /deals /events /halloween; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://www.moval.living$path")
            echo "  $code  https://www.moval.living$path"
            if [ "$code" != "200" ]; then
              echo "::warning::Smoke test failed for $path (got $code)"
            fi
          done
